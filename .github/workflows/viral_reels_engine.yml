name: Autonomous Viral Reels Engine (High-Retention Shorts)

on:
  schedule:
    # 02:30 UTC (8:00 AM IST) -> Peak morning discovery window
    - cron: '30 2 * * *'
    # 11:30 UTC (5:00 PM IST) -> Peak evening Indian commute & leisure window
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (render video without uploading to YouTube)'
        required: false
        default: false
        type: boolean

concurrency:
  group: viral-reels-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce-viral-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Multimedia & Typography Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva fonts-freefont-ttf fonts-dejavu

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Viral Reels Engine Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_CLIENT_SECRET_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRET_BASE64 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python autonomous_viral_reels_engine.py $DRY_RUN_FLAG

      - name: Commit & Push Daily Production Logs and History Back to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Viral Reels Engine upload & history update [skip ci]"
          file_pattern: "history.json"
