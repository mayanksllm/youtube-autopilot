name: YouTube Daily Autopilot (100% Free Cloud Runner)

on:
  schedule:
    # Schedule 1: 00:00 UTC (5:30 AM IST) -> With GitHub queue lag, triggers ~12:00-12:30 PM IST (YouTube Quota Reset)
    - cron: '0 0 * * *'
    # Schedule 2: 07:30 UTC (1:00 PM IST) -> Triggers ~7:30 PM IST (Evening Indian peak)
    - cron: '30 7 * * *'
    # Schedule 3: 14:00 UTC (7:30 PM IST) -> Triggers ~1:30 AM IST (Late night window)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows manual trigger anytime from phone or web browser

concurrency:
  group: youtube-autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Multimedia & Indian Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Autopilot Pipeline (Headless Cloud)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          MAX_DAILY_UPLOADS: "5"
        run: |
          python daily_autopilot.py

      - name: Commit & Push Daily State & History Back to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Daily YouTube uploads completed [skip ci]"
          file_pattern: "history.json daily_report.json autopilot_state.json reel_style_dna.json"
