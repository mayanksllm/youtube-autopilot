name: YouTube Master Autopilot (Consolidated High-Retention Pipeline)

on:
  schedule:
    # Schedule 1: 02:00 UTC (7:30 AM IST) -> Morning Discovery Window
    - cron: '0 2 * * *'
    # Schedule 2: 11:00 UTC (4:30 PM IST) -> Evening Indian Leisure Window
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Select automation pipeline to execute'
        required: true
        default: 'autonomous_viral_reels'
        type: choice
        options:
          - autonomous_viral_reels
          - daily_autopilot
      dry_run:
        description: 'Dry run (render video locally without uploading to YouTube)'
        required: false
        default: false
        type: boolean

concurrency:
  group: youtube-autopilot-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-master-autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Multimedia & Indian Typography
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva fonts-freefont-ttf fonts-dejavu

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Video Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_API_TOKEN: ${{ secrets.HUGGINGFACE_API_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_CLIENT_SECRET_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRET_BASE64 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          MAX_DAILY_UPLOADS: "5"
        run: |
          DRY_RUN_ARG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi

          PIPELINE="${{ inputs.pipeline }}"
          if [ -z "$PIPELINE" ] || [ "$PIPELINE" = "autonomous_viral_reels" ]; then
            echo "🎬 Running Autonomous Viral Reels Engine..."
            python autonomous_viral_reels_engine.py $DRY_RUN_ARG
          else
            echo "📺 Running Daily Autopilot Full Engine..."
            python daily_autopilot.py $DRY_RUN_ARG
          fi

      - name: Commit & Push Daily Production State & Variety Memory
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Autopilot run completed & state synchronized [skip ci]"
          file_pattern: "history.json history_log.json daily_report.json autopilot_state.json variety_store.json"
