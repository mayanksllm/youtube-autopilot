name: Autonomous Daily Shorts Engine

on:
  schedule:
    - cron: '0 2 * * *'   # 7:30 AM IST (Morning Discovery Surge)
    - cron: '0 11 * * *'  # 4:30 PM IST (Evening Peak Leisure Window)
  workflow_dispatch:      # Allows manual trigger button

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & High-Res Typography)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva fonts-freefont-ttf fonts-dejavu

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Reels Engine with Encrypted Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_SECRET_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRET_BASE64 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python autonomous_viral_reels_engine.py

      - name: Cleanup Temporary Media Assets
        if: always()
        run: |
          rm -rf temp/ output/ assets/temp/ assets/output/ *.mp4 *.mp3 *.wav
